# Panel de VM Legal (Sveltia CMS).
# Cada cambio se guarda como commit en el repositorio y GitHub Pages lo publica.
backend:
  name: github
  repo: feliperpovera/vmlegal
  branch: main
  commit_messages:
    create: 'Panel: crea {{collection}} «{{slug}}»'
    update: 'Panel: actualiza {{collection}} «{{slug}}»'
    delete: 'Panel: elimina {{collection}} «{{slug}}»'
    uploadMedia: 'Panel: sube {{path}}'
    deleteMedia: 'Panel: elimina {{path}}'

site_url: https://feliperpovera.github.io/vmlegal/
logo_url: ../assets/img/logo-vmlegal.png

media_folder: uploads
public_folder: /uploads

# Las fotos del equipo se convierten a WebP y se reducen a 800 px al subirlas.
media_libraries:
  default:
    config:
      max_file_size: 15000000
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 800
          height: 800

# Cada documento y cada miembro es un archivo propio: «Nuevo» siempre crea uno
# aparte y editar uno no puede pisar a otro. scripts/unir_datos.py los une al publicar.
collections:
  - name: documentos
    label: Documentos
    label_singular: Documento
    folder: data/documentos
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: titulo
    slug: '{{fields.fecha}}-{{slug}}'
    summary: '{{fecha}} · {{titulo}}'
    sortable_fields: [fecha, titulo, area]
    media_folder: /uploads/documentos
    public_folder: /uploads/documentos
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: fecha, label: Fecha, widget: datetime, time_format: false, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD' }
      - name: area
        label: Área
        widget: select
        options:
          - { label: Tributario, value: tributario }
          - { label: Societario, value: societario }
          - { label: Comercial, value: comercial }
          - { label: Cambiario, value: cambiario }
          - { label: Aduanero, value: aduanero }
      - { name: descripcion, label: Descripción corta, widget: text, required: false }
      - { name: palabras_clave, label: Palabras clave, widget: list, required: false, hint: 'Una por renglón. Sirven para el buscador.' }
      - { name: archivo, label: Archivo PDF, widget: file, accept: application/pdf }
      - { name: destacado, label: Destacar arriba, widget: boolean, default: false, required: false }

  - name: equipo
    label: Equipo
    label_singular: Miembro
    folder: data/equipo
    format: json
    extension: json
    create: true
    delete: true
    identifier_field: nombre
    slug: '{{slug}}'
    summary: '{{orden}} · {{nombre}} · {{cargo}}'
    sortable_fields: [orden, nombre]
    media_folder: /uploads/equipo
    public_folder: /uploads/equipo
    fields:
      - { name: nombre, label: Nombre completo, widget: string }
      - { name: orden, label: Orden en la página, widget: number, value_type: int, default: 100, hint: 'Menor sale primero. Use 10, 20, 30… para dejar espacio entre personas.' }
      - { name: socio, label: Socio(a) fundador(a), widget: boolean, default: false, required: false, hint: 'Aparece arriba, con foto grande, y en el inicio.' }
      - { name: cargo, label: Cargo, widget: string, required: false, hint: 'Ej.: Abogada · Socia' }
      - { name: foto, label: Foto, widget: image, required: false, hint: 'JPG o PNG, retrato vertical. Se convierte a WebP.' }
      - { name: pregrado, label: Pregrado, widget: string, required: false }
      - { name: posgrado, label: Posgrado, widget: string, required: false }
      - { name: perfil, label: Perfil (texto largo), widget: text, required: false }
